# Veröffentlichen, sobald packaging/release.sh einen Tag v* pusht:
#   1. Linux-Tarball (Debian-12-Container, packaging/build-release.sh) und Windows-Zip
#      (windows-release.yml) bauen
#   2. Release als Entwurf anlegen, beides anhängen, dann veröffentlichen — erst dann
#      sieht Scoops Excavator die Version, nie ein Release ohne Zip
#   3. COPR (Fedora) anstossen, sofern die Zugangsdaten als Secret da sind, und die
#      apt-Quelle (apt.yml) nachziehen
# Scoop braucht hier nichts: der Excavator im Bucket gstrainovic/scoop-zid prüft alle
# 4 Stunden das neueste Release (checkver/autoupdate im Manifest).
#
# Von Hand (workflow_dispatch) baut er nur, ohne zu veröffentlichen.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Tarball bauen (Debian 12)
        run: packaging/build-release.sh --engine docker
      # Aus demselben Binary: .deb (Debian, Ubuntu, Mint) und .rpm (Fedora, openSUSE).
      # nfpm fest gepinnt, Prüfsumme aus dem GitHub-Release.
      - name: .deb und .rpm
        run: |
          curl -sSLf -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm.tgz" | sha256sum -c -
          tar -xzf nfpm.tgz nfpm
          export VERSION="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          tar -xJf "dist/zid-$VERSION-x86_64-linux.tar.xz" -C "$RUNNER_TEMP"
          export STAGE="$RUNNER_TEMP/zid-$VERSION-x86_64-linux"
          for p in deb rpm; do ./nfpm package -f packaging/nfpm.yaml -p "$p" -t dist/; done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: zid-linux
          path: |
            dist/zid-*-x86_64-linux.tar.xz*
            dist/*.deb
            dist/*.rpm

  windows:
    uses: ./.github/workflows/windows-release.yml

  # Snap aus dem Tarball (snap/snapcraft.yaml). --destructive-mode baut direkt auf dem
  # Runner, dafür muss er zu base core24 passen: Ubuntu 24.04.
  snap:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: zid-linux
          path: dist
      - name: Snap packen
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          mkdir snap-src
          tar -xJf "dist/zid-$version-x86_64-linux.tar.xz" -C snap-src --strip-components=1
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode
          ls -la ./*.snap
      - uses: actions/upload-artifact@v7
        with:
          name: zid-snap
          path: ./*.snap

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Tag, build.zig.zon und Dateinamen müssen zusammenpassen, sonst zeigt das Release
      # auf Archive mit anderer Version (release.sh setzt alles in einem Commit).
      - name: Version prüfen
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG passt nicht zu build.zig.zon ($version)"; exit 1; }
          ls -la dist
          test -f "dist/zid-$version-x86_64-linux.tar.xz"
          test -f "dist/zid-$version-x86_64-windows.zip"
          test -f "dist/zid_${version}_amd64.snap"
          ls dist/*.deb dist/*.rpm
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release anlegen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Text aus dem neuesten AppStream-Eintrag (release.sh schreibt ihn)
          python3 - > notes.md <<'PY'
          import re
          xml = open("packaging/io.github.gstrainovic.zid.metainfo.xml", encoding="utf-8").read()
          first = re.search(r"<release [^>]*>(.*?)</release>", xml, re.S).group(1)
          for p in re.findall(r"<p>(.*?)</p>", first, re.S):
              print("- " + p.replace("&lt;", "<").replace("&gt;", ">").replace("&amp;", "&"))
          PY
          gh release create "$TAG" dist/* --draft --verify-tag --title "zid $VERSION" --notes-file notes.md
          gh release edit "$TAG" --draft=false --latest

  copr:
    needs: publish
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Ohne Secret COPR_CONFIG überspringen
        if: env.COPR_CONFIG == ''
        run: echo "::warning::Secret COPR_CONFIG fehlt, COPR nicht gebaut (Inhalt von ~/.config/copr)"
      # copr-cli nimmt ein SRPM, keine Spec; Source0 kommt aus dem gerade
      # veröffentlichten Release.
      - name: SRPM bauen und an COPR schicken
        if: env.COPR_CONFIG != ''
        run: |
          dnf install -y -q rpm-build copr-cli
          mkdir -p ~/.config sources
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          curl -sSLf -o "sources/zid-$VERSION-x86_64-linux.tar.xz" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/zid-$VERSION-x86_64-linux.tar.xz"
          rpmbuild -bs --define "_topdir $PWD/rpm" --define "_sourcedir $PWD/sources" packaging/rpm/zid.spec
          copr-cli build gstrainovic/zid rpm/SRPMS/zid-"$VERSION"-*.src.rpm

  # apt-Quelle auf GitHub Pages (Debian, Ubuntu), samt Installationsprobe
  apt:
    needs: publish
    uses: ./.github/workflows/apt.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  # Snap Store, Kanal stable. Solange die Classic-Freigabe fehlt, lehnt der Store den
  # Upload ab (manuelle Prüfung); das hält das Release nicht auf.
  snapstore:
    needs: publish
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Ohne Secret SNAPCRAFT_STORE_CREDENTIALS überspringen
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::warning::Secret SNAPCRAFT_STORE_CREDENTIALS fehlt, Snap nicht hochgeladen (snapcraft export-login)"
      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: zid-snap
      - name: In den Snap Store laden
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload --release=stable ./*.snap
